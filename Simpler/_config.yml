#-------------------------------
# General Site Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://glutenfreehackerscollective.org" # the base hostname & protocol for your site, e.g. http://example.com
favicon_ico: "/assets/images/favicon.ico"

#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  # - jekyll-paginate # Disabled with the unused template blog.
  - jekyll-sitemap

# paginate: 6 # Disabled with the unused template blog.
# paginate_path: "/page/:num"



#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug/
  # The template-only portfolio collection remains disabled.
  # projects:
  #   output: true
  #   permalink: /project/:slug
  conferences:
    output: true
    permalink: /conferences/:slug/

# Pages Path
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  # The template-only portfolio defaults remain disabled.
  # - scope:
  #     path: ""
  #     type: "projects"
  #   values:
  #     layout: "project"
  - scope:
      path: ""
      type: "conferences"
    values:
      layout: "post"

sass:
  sass_dir: _sass
  style: compressed
