# Site Settings
title: Gluten Free Hacker Collective
logo: "/images/transparent_logo.png" # You can add own logo. For example "/images/logo.svg".
logo_dark: "/images/transparent_logo.png"
description: Website for the Gluten Free Hacker Collective. 
color_scheme: dark # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the users can choose the light or dark mode themself.


