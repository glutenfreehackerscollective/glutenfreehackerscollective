# Hero Settings
hero:
  enable: true
  hero_title: Gluten Free <span><i>Hackers</i></span> Collective # Add the "span" tag to highlight text.
  hero_description: Welcome one, welcome all! The Gluten-Free Hackers Collective is here to help you find gluten-free eats, wherever your adventure through cyberspace takes you. Feel free to checkout the site, come hang with us in discord, and PR any recommendations that you have for your fellow hackers!
  hero_image: "/images/cybersecurity-hero.png"
  # hero_button_contact: Get In Touch # Disabled with the unused template contact form.
  hero_button_about: About Us


